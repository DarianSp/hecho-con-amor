<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hecho con Amor | Boutique Artesanal</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ===== TU CSS SIN CAMBIOS ===== */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Montserrat',sans-serif;
}

html{ scroll-behavior:smooth; }

body{
    background:#fff;
    color:#222;
    overflow-x:hidden;
}

/* NAVBAR */
nav{
    width:100%;
    position:fixed;
    top:0;
    left:0;
    z-index:1000;
    backdrop-filter:blur(15px);
    background:rgba(255,255,255,0.88);
    border-bottom:1px solid rgba(0,0,0,0.05);
}

.nav-container{
    width:90%;
    max-width:1400px;
    margin:auto;
    height:80px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:1.7rem;
    font-weight:700;
    color:#d63384;
}

.nav-links{
    display:flex;
    gap:35px;
}

.nav-links a{
    text-decoration:none;
    color:#444;
    font-weight:500;
}

/* PRODUCTS */
.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:35px;
}

.product-card{
    position:relative;
    background:white;
    border-radius:28px;
    overflow:hidden;
    box-shadow:0 18px 40px rgba(0,0,0,0.08);
}

/* FAVORITO */
.favorite-btn{
    position:absolute;
    top:15px;
    right:15px;
    width:50px;
    height:50px;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,0.95);
    cursor:pointer;
    font-size:1.4rem;
}

.favorite-btn.active{
    background:#ffebf3;
    color:#d63384;
}

/* BOTON */
.selection-box{
    position:fixed;
    bottom:25px;
    right:25px;
}

.send-selection{
    background:#25D366;
    color:white;
    border:none;
    padding:18px 28px;
    border-radius:60px;
    font-weight:700;
    cursor:pointer;
}
</style>
</head>

<body>

<!-- PRODUCTOS (ejemplo) -->
<div class="products">

    <div class="product-card" data-product="Lazo 1">
        <button class="favorite-btn">♡</button>
        <img src="lazo1.jpeg" width="100%">
    </div>

    <div class="product-card" data-product="Lazo 2">
        <button class="favorite-btn">♡</button>
        <img src="lazo2.jpeg" width="100%">
    </div>

</div>

<!-- BOTÓN -->
<div class="selection-box">
    <button class="send-selection" onclick="sendWhatsAppSelection()">
        ❤️ Enviar selección
    </button>
</div>

<!-- SCRIPT CORREGIDO -->
<script>

let favorites = [];

document.querySelectorAll('.favorite-btn').forEach(button => {

    button.addEventListener('click', () => {

        const card = button.closest('.product-card');
        const product = card.getAttribute('data-product');

        button.classList.toggle('active');

        if (button.classList.contains('active')) {

            button.innerHTML = '❤';

            if (!favorites.includes(product)) {
                favorites.push(product);
            }

        } else {

            button.innerHTML = '♡';

            favorites = favorites.filter(item => item !== product);
        }
    });

});

function sendWhatsAppSelection() {

    if (favorites.length === 0) {
        alert("Selecciona al menos un producto ❤️");
        return;
    }

    let message = "Hola 🎀 Me interesan estos productos:%0A%0A";

    favorites.forEach(item => {
        message += "• " + item + "%0A";
    });

    const phone = "18099727422";

    window.open(
        `https://wa.me/${phone}?text=${encodeURIComponent(message)}`,
        '_blank'
    );
}

</script>

</body>
</html>
